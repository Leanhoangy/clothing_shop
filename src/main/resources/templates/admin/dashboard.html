<!doctype html>
<html th:replace="admin/layout">
<body>
  <div th:fragment="content" class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-semibold mb-6">Bảng điều khiển</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="text-sm text-gray-500">Tổng doanh thu</div>
        <div class="text-2xl font-bold mt-2" th:text="${totalRevenue}"></div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="text-sm text-gray-500">Tổng đơn hàng</div>
        <div class="text-2xl font-bold mt-2" th:text="${totalOrders}"></div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="text-sm text-gray-500">Số người dùng</div>
        <div class="text-2xl font-bold mt-2" th:text="${totalUsers}"></div>
      </div>
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
        <div class="text-sm text-gray-500">Tỷ lệ tăng trưởng</div>
        <div class="text-2xl font-bold mt-2" th:text="${#numbers.formatDecimal(growth, 1, 1)} + '%'"></div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <section class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-lg p-4 border border-gray-200 dark:border-gray-700">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-semibold">Doanh thu theo tháng</h2>
          <div class="text-sm text-gray-500">2026</div>
        </div>
        <div class="h-64 w-full">
          <canvas id="revenueChart" class="w-full h-full" data-monthly-th="[[${monthly}]]"></canvas>
        </div>
      </section>

      <section class="bg-white dark:bg-gray-800 rounded-lg p-4 border border-gray-200 dark:border-gray-700">
        <h2 class="font-semibold mb-4">Đơn hàng mới nhất</h2>
        <div id="orders-table" class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
            <thead>
              <tr class="text-left text-sm text-gray-500">
                <th class="px-3 py-2">Mã đơn</th>
                <th class="px-3 py-2">Khách hàng</th>
                <th class="px-3 py-2">Số tiền</th>
                <th class="px-3 py-2">Trạng thái</th>
              </tr>
            </thead>
            <tbody id="orders-body" class="bg-white dark:bg-gray-800 divide-y divide-gray-100 dark:divide-gray-700">
              <tr th:if="${latestOrders.content.isEmpty()}">
                <td colspan="4" class="px-3 py-3 text-sm text-gray-500">Chưa có đơn hàng</td>
              </tr>
              <tr th:each="o : ${latestOrders.content}" class="table-row-hover">
                <td class="px-3 py-3" th:text="${'ORD-' + o.id}"></td>
                <td class="px-3 py-3" th:text="${o.recipientName}"></td>
                <td class="px-3 py-3" th:text="${o.totalAmount}"></td>
                <td class="px-3 py-3" th:text="${o.status}"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="mt-4 flex items-center justify-between">
          <div id="orders-empty" class="hidden text-sm text-gray-500">Không có đơn</div>
          <div class="flex items-center gap-2">
            <a href="/admin/orders" class="px-3 py-1 rounded-md bg-gray-100 dark:bg-gray-700 hover:bg-gray-200">Xem tất cả đơn hàng</a>
          </div>
        </div>
      </section>
    </div>
  </div>

<script th:inline="javascript">
/*<![CDATA[*/
  var ADMIN_MONTHLY = /*[[${monthly}]]*/ [];
/*]]>*/
</script>
</body>
</html>
