<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:replace="admin/layout">
  <div th:fragment="content" class="max-w-7xl mx-auto">

        <div class="bg-white rounded-lg shadow p-6">

            <h1 class="text-2xl font-bold mb-6"
                th:text="${productForm.id() == null ? 'Thêm sản phẩm' : 'Cập nhật sản phẩm'}">
            </h1>

            <form th:action="@{/admin/products/save}"
                  method="post">

                <input type="hidden"
                       name="id"
                       th:value="${productForm.id()}">

                <div class="mb-4">
                    <label class="block mb-1 font-medium">
                        Tên sản phẩm
                    </label>

                    <input type="text"
                           name="name"
                           th:value="${productForm.name()}"
                           class="w-full border rounded p-2"
                           required>
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-medium">
                        Slug
                    </label>

                    <input type="text"
                           name="slug"
                           th:value="${productForm.slug()}"
                           class="w-full border rounded p-2">
                </div>

                <div class="mb-4">
                    <label class="block mb-1 font-medium">
                        Mô tả
                    </label>

                    <textarea name="description"
                              rows="4"
                              class="w-full border rounded p-2"
                              th:text="${productForm.description()}">
                    </textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">

                    <div>
                        <label class="block mb-1 font-medium">
                            Giá
                        </label>

                        <input type="number"
                               step="0.01"
                               name="price"
                               th:value="${productForm.price()}"
                               class="w-full border rounded p-2"
                               required>
                    </div>

                    <div>
                        <label class="block mb-1 font-medium">
                            Tồn kho
                        </label>

                        <input type="number"
                               name="stock"
                               th:value="${productForm.stock()}"
                               class="w-full border rounded p-2"
                               required>
                    </div>

                </div>

                <div class="mt-4">
                    <label class="block mb-1 font-medium">
                        Thumbnail
                    </label>

                    <input type="text"
                           name="thumbnail"
                           th:value="${productForm.thumbnail()}"
                           class="w-full border rounded p-2">
                </div>

                <div class="mt-4">

                    <label class="block mb-1 font-medium">
                        Danh mục
                    </label>

                    <select name="categoryId"
                            class="w-full border rounded p-2"
                            required>

                        <option value="">
                            -- Chọn danh mục --
                        </option>

                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${productForm.categoryId() == c.id}">
                        </option>

                    </select>

                </div>

                <div class="mt-6 flex gap-3">

                    <button type="submit"
                            class="bg-green-600 text-white px-5 py-2 rounded">
                        Lưu
                    </button>

                    <a th:href="@{/admin/products}"
                       class="bg-gray-500 text-white px-5 py-2 rounded">
                        Hủy
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
