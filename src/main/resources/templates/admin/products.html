<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:replace="admin/layout">

  <div th:fragment="content" class="max-w-7xl mx-auto">

        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Quản lý sản phẩm</h1>

            <a th:href="@{/admin/products/add}"
               class="bg-green-600 text-white px-4 py-2 rounded">
                + Thêm sản phẩm
            </a>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">

            <table class="min-w-full">

                <thead class="bg-gray-100">
                <tr>
                    <th class="p-3">ID</th>
                    <th class="p-3">Tên</th>
                    <th class="p-3">Danh mục</th>
                    <th class="p-3">Giá</th>
                    <th class="p-3">Tồn kho</th>
                    <th class="p-3">Hành động</th>
                </tr>
                </thead>

                <tbody>

                <tr th:if="${products.isEmpty()}">
                    <td colspan="6" class="text-center p-4">
                        Không có sản phẩm
                    </td>
                </tr>

                <tr th:each="product : ${products}">
                    <td class="p-3" th:text="${product.id}"></td>

                    <td class="p-3" th:text="${product.name}"></td>

                    <td class="p-3" th:text="${product.category.name}"></td>

                    <td class="p-3"
                        th:text="${#numbers.formatDecimal(product.price,1,2)}">
                    </td>

                    <td class="p-3" th:text="${product.stock}"></td>

                    <td class="p-3 space-x-2">

                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                           class="bg-blue-500 text-white px-3 py-1 rounded">
                            Sửa
                        </a>

                        <a th:href="@{/admin/products/delete/{id}(id=${product.id})}"
                           onclick="return confirm('Bạn có chắc muốn xóa?')"
                           class="bg-red-500 text-white px-3 py-1 rounded">
                            Xóa
                        </a>

                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
