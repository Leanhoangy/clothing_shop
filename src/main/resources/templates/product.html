<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${product.name} + ' — YASHOP'">Chi tiết sản phẩm</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="~{fragments/layout :: header}"></div>

  <div class="container">
    <nav class="breadcrumb">
      <a th:href="@{/}">Trang chủ</a> / <span th:text="${product.category.name}">Danh mục</span> /
      <span th:text="${product.name}">Sản phẩm</span>
    </nav>

    <div class="product">
      <!-- Cột ảnh -->
      <div class="product-media">
        <img class="main-img" th:src="@{'/' + ${product.thumbnail}}" th:alt="${product.name}" id="mainImg">
        <div class="thumbs">
          <img th:each="img : ${product.images}" th:src="@{'/' + ${img.imagePath}}"
               th:alt="${product.name}" loading="lazy"
               onclick="document.getElementById('mainImg').src=this.src">
        </div>
      </div>

      <!-- Cột thông tin -->
      <div class="product-info">
        <span class="cat" th:text="${product.category.name}">Danh mục</span>
        <h1 th:text="${product.name}">Tên sản phẩm</h1>
        <div class="price-row">
          <span class="price-lg" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'NONE')} + 'đ'">0đ</span>
          <span class="price-old" th:text="${#numbers.formatDecimal(product.price * 1.3, 0, 'POINT', 0, 'NONE')} + 'đ'">0đ</span>
          <span class="discount">-23%</span>
        </div>
        <p class="desc" th:text="${product.description}">Mô tả sản phẩm</p>

        <div class="sizes">
          <span class="size-label">Kích cỡ:</span>
          <span class="size">S</span><span class="size">M</span>
          <span class="size">L</span><span class="size">XL</span>
        </div>

        <div class="stock-line">
          <span class="dot"></span> Còn hàng — <strong th:text="${product.stock}">0</strong> sản phẩm trong kho
        </div>

        <form class="buy-actions" th:action="@{/cart/add}" method="post">
          <input type="hidden" name="productId" th:value="${product.id}">
          <div class="qty">
            <label>Số lượng</label>
            <input type="number" name="quantity" value="1" min="1" max="99">
          </div>
          <div class="buy-btns">
            <button class="btn btn-outline" type="submit">THÊM VÀO GIỎ</button>
            <button class="btn" type="submit">MUA NGAY</button>
          </div>
        </form>

        <ul class="perks">
          <li>🚚 Freeship đơn từ 200K</li>
          <li>🔁 Đổi trả trong 30 ngày</li>
          <li>✅ Cam kết chính hãng</li>
        </ul>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
