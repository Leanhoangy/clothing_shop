<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng của tôi — HuyRC</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  </head>
<body>
  <div th:replace="~{fragments/layout :: header}"></div>

  <div class="container">
    <h1 class="page-title">ĐƠN HÀNG CỦA TÔI</h1>

    <div class="empty" th:if="${#lists.isEmpty(orders)}">
      <p>Bạn chưa có đơn hàng nào.</p>
      <a class="btn" th:href="@{/}">MUA SẮM NGAY</a>
    </div>

    <table class="order-table" th:unless="${#lists.isEmpty(orders)}">
      <thead>
        <tr><th>Mã đơn</th><th>Ngày đặt</th><th>Trạng thái</th><th>Tổng tiền</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="o : ${orders}">
          <td th:text="'#' + ${o.id}">#1</td>
          <td th:text="${o.createdAt != null} ? ${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')} : '-'">-</td>
          <td><span class="status" th:text="${o.status}">PENDING</span></td>
          <td th:text="${#numbers.formatDecimal(o.totalAmount,0,'POINT',0,'NONE')} + 'đ'">0đ</td>
          <td><a class="view-all" th:href="@{/orders/{id}(id=${o.id})}">Xem →</a></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
